name: Weekly SEO report (P5)

on:
  schedule:
    # 毎週月曜 06:00 JST = 日曜 21:00 UTC
    - cron: '0 21 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "p5-weekly"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
  SC_SITE_URL: ${{ secrets.SC_SITE_URL || 'https://kingsworksub-jpg.github.io/' }}
  AMAZON_STORAGE_STATE_B64: ${{ secrets.AMAZON_STORAGE_STATE_B64 }}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install automation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-automation.txt

      - name: Install Chromium for Amazon report
        if: env.AMAZON_STORAGE_STATE_B64 != ''
        run: python -m playwright install --with-deps chromium

      # 1. GA4カスタム定義4つを登録 + Search Console CSV を取得
      - name: Google API (GA4 definitions + Search Console CSV)
        run: python scripts/google-automation.py

      # 2. Amazon アソシエイトの数値を自動回収
      - name: Amazon associate report
        run: python scripts/amazon-report-fetch.py

      # 3. SC + Amazon を1枚に集約（CSVが無い場合はスキップ）
      - name: Aggregate P0 metrics
        run: |
          if [ -f scripts/p0-sc.csv ]; then
            python scripts/p0-metrics.py --sc scripts/p0-sc.csv --amazon scripts/p0-amazon.json
          else
            echo "SKIP: scripts/p0-sc.csv がありません（SC未設定）"
          fi

      # 4. 週次レポート生成
      - name: Generate weekly report
        run: python scripts/p5-weekly.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in \
            scripts/p0-sc.csv \
            scripts/p0-amazon.json \
            scripts/p0-metrics.md scripts/p0-metrics.json \
            scripts/p0-views.md scripts/p0-views.json \
            scripts/p5-weekly.md scripts/p5-weekly.json scripts/p5-snapshot.json
          do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: weekly SEO report (P5) - auto data collection"

          # 他の自動化と push が競合してもワークフロー全体は失敗させない
          for i in 1 2 3; do
            if ! git pull --rebase origin main; then
              git rebase --abort 2>/dev/null || true
              echo "WARN: rebase に失敗したため push をスキップします"
              exit 0
            fi
            if git push; then
              echo "OK: pushed"
              exit 0
            fi
            echo "WARN: push 失敗 (${i}/3)、再試行します"
          done
          echo "WARN: push できませんでした。次回実行時に反映されます"
