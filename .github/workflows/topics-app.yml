name: Build topics Android app

on:
  push:
    branches: ["main"]
    paths:
      - "android/topics-app/**"
      - ".github/workflows/topics-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topics-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TOPICS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/topics.jks"
          echo "TOPICS_KEYSTORE_PATH=$RUNNER_TEMP/topics.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          TOPICS_KEYSTORE_PASSWORD: ${{ secrets.TOPICS_KEYSTORE_PASSWORD }}
          TOPICS_KEY_PASSWORD: ${{ secrets.TOPICS_KEYSTORE_PASSWORD }}
          TOPICS_KEY_ALIAS: ${{ secrets.TOPICS_KEY_ALIAS }}
        run: gradle -p android/topics-app assembleRelease --no-daemon --stacktrace

      - name: Publish to the topics-app-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/topics-app/app/build/outputs/apk/release/app-release.apk blog-topics.apk
          gh release delete topics-app-latest --yes --cleanup-tag || true
          gh release create topics-app-latest blog-topics.apk \
            --title "ブログのネタ（Android アプリ）" \
            --notes "build ${GITHUB_RUN_NUMBER} / ${GITHUB_SHA::7}。スマホでこの APK をダウンロードしてインストールしてください（初回は「提供元不明のアプリ」の許可が必要）。" \
            --latest=false
