{{- define "main" }}
{{- partial "home_info.html" . }}

<section id="post-explorer">
  <h1 class="pe-heading">記事をさがす</h1>

  <div class="pe-controls">
    <input type="search" id="pe-search" class="pe-input" placeholder="キーワードで全文検索(例: Ableton、レコード、コスパ)" autocomplete="off">

    <div class="pe-row">
      <div class="pe-chips" id="pe-categories">
        <button type="button" class="pe-chip is-active" data-cat="all">すべて</button>
      </div>

      <select id="pe-sort" class="pe-select">
        <option value="date-desc">新着順</option>
        <option value="date-asc">投稿が古い順</option>
        <option value="views-desc">閲覧数が多い順</option>
      </select>
    </div>
  </div>

  <p class="pe-status" id="pe-status">読み込み中…</p>

  <div class="pe-grid" id="pe-results"></div>
  <p class="pe-empty" id="pe-empty" hidden>該当する記事が見つかりませんでした。</p>
</section>

<style>
#post-explorer{margin-top:2rem}
.pe-heading{font-size:1.3rem;margin-bottom:1rem}
.pe-controls{display:flex;flex-direction:column;gap:.6rem;margin-bottom:.8rem}
.pe-input{
  width:100%;box-sizing:border-box;padding:.6rem .9rem;font-size:1rem;
  border:1px solid var(--border);border-radius:8px;background:var(--theme);color:var(--content);
}
.pe-input:focus{outline:2px solid var(--secondary);outline-offset:1px}
.pe-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between}
.pe-chips{display:flex;flex-wrap:wrap;gap:.4rem}
.pe-chip{
  padding:.3rem .8rem;border-radius:999px;border:1px solid var(--border);
  background:var(--entry);color:var(--secondary);font-size:.85rem;cursor:pointer;
}
.pe-chip.is-active{background:var(--primary);color:var(--theme);border-color:var(--primary)}
.pe-select{
  padding:.4rem .6rem;border-radius:8px;border:1px solid var(--border);
  background:var(--entry);color:var(--content);font-size:.85rem;
}
.pe-status{color:var(--secondary);font-size:.85rem;margin:.3rem 0 1rem}
.pe-grid{display:flex;flex-direction:column;gap:.9rem}
.pe-card{
  display:block;padding:1rem 1.1rem;border:1px solid var(--border);border-radius:12px;
  background:var(--entry);text-decoration:none;color:inherit;transition:border-color .15s ease;
}
.pe-card:hover{border-color:var(--secondary)}
.pe-card-title{font-size:1.05rem;font-weight:600;color:var(--primary);margin:0 0 .35rem}
.pe-card-meta{font-size:.78rem;color:var(--secondary);margin-bottom:.5rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.pe-card-cat{
  display:inline-block;padding:.1rem .55rem;border-radius:999px;background:var(--code-bg);
  color:var(--secondary);font-size:.72rem;
}
.pe-card-summary{font-size:.9rem;color:var(--content);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pe-empty{color:var(--secondary);font-size:.9rem}
mark{background:none;color:var(--primary);font-weight:700;text-decoration:underline;text-decoration-color:var(--tertiary)}
</style>

<script>
(function () {
  var CATEGORY_LABELS = {
    gear: "機材レビュー",
    software: "DTMソフト・Tips",
    setup: "制作環境公開",
    learning: "スクール・学習",
    whisky: "ウイスキー"
  };
  var COUNTER_BASE = "https://countapi.mileshilliard.com/api/v1/get/";

  var state = { query: "", category: "all", sort: "date-desc" };
  var posts = [];
  var viewsLoaded = false;

  var els = {
    search: document.getElementById("pe-search"),
    cats: document.getElementById("pe-categories"),
    sort: document.getElementById("pe-sort"),
    status: document.getElementById("pe-status"),
    results: document.getElementById("pe-results"),
    empty: document.getElementById("pe-empty")
  };

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    var escaped = escapeHtml(text);
    var escQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    try {
      return escaped.replace(new RegExp("(" + escQuery + ")", "ig"), "<mark>$1</mark>");
    } catch (e) {
      return escaped;
    }
  }

  function buildCategoryChips() {
    var set = {};
    posts.forEach(function (p) { (p.categories || []).forEach(function (c) { set[c] = true; }); });
    Object.keys(set).sort().forEach(function (cat) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pe-chip";
      btn.dataset.cat = cat;
      btn.textContent = CATEGORY_LABELS[cat] || cat;
      els.cats.appendChild(btn);
    });
    els.cats.addEventListener("click", function (e) {
      var btn = e.target.closest(".pe-chip");
      if (!btn) return;
      els.cats.querySelectorAll(".pe-chip").forEach(function (b) { b.classList.remove("is-active"); });
      btn.classList.add("is-active");
      state.category = btn.dataset.cat;
      render();
    });
  }

  function loadViewCounts() {
    var jobs = posts.map(function (p) {
      return fetch(COUNTER_BASE + encodeURIComponent(p.key))
        .then(function (r) { return r.ok ? r.json() : { value: 0 }; })
        .then(function (data) { p.views = parseInt(data && data.value, 10) || 0; })
        .catch(function () { p.views = 0; });
    });
    Promise.all(jobs).then(function () {
      viewsLoaded = true;
      render();
    });
  }

  function matchesQuery(post, q) {
    if (!q) return true;
    var hay = (post.title + " " + post.content).toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function render() {
    var q = state.query.trim().toLowerCase();
    var filtered = posts.filter(function (p) {
      var catOk = state.category === "all" || (p.categories || []).indexOf(state.category) !== -1;
      return catOk && matchesQuery(p, q);
    });

    filtered.sort(function (a, b) {
      if (state.sort === "date-asc") return a.date.localeCompare(b.date);
      if (state.sort === "views-desc") return (b.views || 0) - (a.views || 0);
      return b.date.localeCompare(a.date);
    });

    els.results.innerHTML = "";
    filtered.forEach(function (p) {
      var a = document.createElement("a");
      a.className = "pe-card";
      a.href = p.relpermalink;

      var catsHtml = (p.categories || []).map(function (c) {
        return '<span class="pe-card-cat">' + escapeHtml(CATEGORY_LABELS[c] || c) + '</span>';
      }).join("");

      var viewsHtml = viewsLoaded
        ? ("👁 " + (p.views || 0) + " views")
        : "閲覧数 読み込み中…";

      a.innerHTML =
        '<h2 class="pe-card-title">' + highlight(p.title, q) + '</h2>' +
        '<div class="pe-card-meta"><span>' + p.date + '</span><span>' + viewsHtml + '</span>' + catsHtml + '</div>' +
        '<p class="pe-card-summary">' + highlight(p.summary, q) + '</p>';
      els.results.appendChild(a);
    });

    els.empty.hidden = filtered.length !== 0;
    els.status.textContent = filtered.length + " 件の記事" + (q ? "(「" + state.query + "」で検索)" : "");
  }

  fetch("{{ "index.json" | relURL }}")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      posts = (data || []).filter(function (p) { return p.categories && p.categories.length > 0; });
      buildCategoryChips();
      render();
      loadViewCounts();

      els.search.addEventListener("input", function (e) {
        state.query = e.target.value;
        render();
      });
      els.sort.addEventListener("change", function (e) {
        state.sort = e.target.value;
        render();
      });
    })
    .catch(function () {
      els.status.textContent = "記事一覧の読み込みに失敗しました。";
    });
})();
</script>
{{- end }}
