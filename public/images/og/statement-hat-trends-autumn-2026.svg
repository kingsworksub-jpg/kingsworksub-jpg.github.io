<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3436;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E272E;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative hat silhouettes -->
  <g opacity="0.15">
    <!-- Wide-brim hat (left) -->
    <ellipse cx="200" cy="200" rx="120" ry="80" fill="#D4AF37" transform="rotate(-15 200 200)"/>
    <path d="M 80 200 Q 80 240 120 260 L 280 260 Q 320 240 320 200" fill="#D4AF37" opacity="0.8" transform="rotate(-15 200 200)"/>

    <!-- Bucket hat (right) -->
    <circle cx="1000" cy="180" r="100" fill="#8B6F47"/>
    <path d="M 900 180 L 880 240 Q 880 270 920 280 L 1080 280 Q 1120 270 1120 240 L 1100 180" fill="#8B6F47" opacity="0.7"/>
  </g>

  <!-- Main title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    ステートメント
  </text>
  <text x="600" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#D4AF37">
    ハットの現在地
  </text>

  <!-- Subtitle -->
  <text x="600" y="380" font-family="Georgia, serif" font-size="32" text-anchor="middle" fill="#E8E8E8">
    ミニマルから最大主義への転換
  </text>

  <!-- Footer accent line -->
  <line x1="300" y1="450" x2="900" y2="450" stroke="#D4AF37" stroke-width="3" opacity="0.6"/>

  <!-- Season marker -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#B8860B">
    Autumn/Winter 2026
  </text>
</svg>